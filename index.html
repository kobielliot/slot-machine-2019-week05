<!DOCTYPE html>
<html lang="en">
	<head>
    	<meta charset="utf-8">

		<title>Kobi's Slot Machine</title>

		<!-- external CSS link -->
		<link rel="stylesheet" href="css/normalize.css">
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>
		<main>
			
			<div class="title">
				<h1>Kobi's Slot Machine</h1>
				<p>Try Your Luck</p>
			</div>
			<div class="bank">
				<p>You start off with 1000 points. The minimum bet is 50 pts and the maximum is however many points in your bank. Each win or loss is either an addition or subtraction of 250 points. </p>
			  </div>	
			<div id ="reels">
				<p id="reelOne" class="icons">
				</p>	
				<p id="reelTwo" class="icons">
				</p>	
				<p id="reelThree" class="icons">
				</p>
			</div>
			<div id="pressButton">
				<button id="max">Max Bet(250)</button>
				<button id="min">Min Bet(50)</button>
			</div>
			<div class="title">
				<p id ="results">Current Bank:1000</p>	
				<p id="bank"></p> 
			</div>	
		</main>
		

		<script type="text/javascript" src="js/main.js"></script>
	</body>
